[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "betaflight-mcp"
version         = "0.1.0"
description     = "MCP server to read and configure a Betaflight flight controller over USB serial"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"
authors         = [{ name = "Sébastien Galina", email = "galina.sebastien@gmail.com" }]
keywords        = ["mcp", "betaflight", "drone", "fpv", "flight-controller", "msp", "serial", "model-context-protocol"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyserial>=3.5",
    "mcp>=1.0.0",
]

[project.urls]
Homepage       = "https://github.com/SebGalina/betaflight-mcp"
Repository     = "https://github.com/SebGalina/betaflight-mcp"
"Bug Tracker"  = "https://github.com/SebGalina/betaflight-mcp/issues"

[project.scripts]
betaflight-mcp = "main:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["betaflight*", "server*", "config*"]
