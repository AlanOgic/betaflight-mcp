name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # créer la GitHub Release
  id-token: write   # PyPI trusted publishing (OIDC, pas de token à stocker)

jobs:
  # ── 1. Tests ──────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v

  # ── 2. Build + GitHub Release + PyPI ─────────────────────────────────
  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release   # optionnel : protège le déploiement PyPI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          pip install build
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Nécessite un "Trusted Publisher" configuré sur pypi.org :
      #   Publisher : GitHub Actions
      #   Owner     : SebGalina
      #   Repo      : betaflight-mcp
      #   Workflow  : publish.yml
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
